<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <div class="search">
        <input type="text" placeholder="enter city name" spellcheck="false">
        <button><img src="images/search.png"></button>
    </div>
    <div class="weather">
        <img src="" class="weather-icon">
        <h1 class="temp">--°C</h1>
        <h2 class="city">Enter a city to get weather information</h2>
        <div class="details">
            <div class="col">
                <img src="images/humidity.png">
                <div>
                    <p class="humidity">--%</p>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="images/wind.png">
                <div>
                    <p class="wind">--km/h</p>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const apiKey = "be277c78158c8332393363b98604f9f9";
    const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";
    const searchBox = document.querySelector(".search input");
    const searchBtn = document.querySelector(".search button");
    const weatherIcon = document.querySelector(".weather-icon");

      // Function to get weather by city name
    async function checkWeather(city) {
        const url = `${apiUrl}${city}&appid=${apiKey}`;

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (data.cod === 200) {
                document.querySelector(".city").innerHTML = data.name;
                document.querySelector(".temp").innerHTML = data.main.temp + "°C";
                document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
                document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";

                const weatherMain = data.weather[0].main.toLowerCase();

                if (weatherMain === "clouds") {
                    weatherIcon.src = "images/clouds.png";
                } else if (weatherMain === "clear") {
                    weatherIcon.src = "images/clear.png";
                } else if (weatherMain === "rain") {
                    weatherIcon.src = "images/rain.png";
                } else if (weatherMain === "drizzle") {
                    weatherIcon.src = "images/drizzle.png";
                } else if (weatherMain === "mist") {
                    weatherIcon.src = "images/mist.png";
                } 
                else if(weatherMain== "snow"){
                    weatherIcon.src="images/snow.png";
                 } 
                        } else {
                alert("City not found. Please enter a valid city name.");
            }
        } catch (error) {
            console.error("Error fetching weather data:", error);
            alert("Unable to retrieve weather data. Please try again later.");
        }
    }

    
    // Function to get weather by user's current location

    async function  getWeatherByLocation(lat, lon) {

    const url = `https://api.openweathermap.org/data/2.5/weather?units=metric&lat=${lat}&lon=${lon}&appid=${apiKey}`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.cod === 200) { // 200 is the success status code
                document.querySelector(".city").innerHTML = data.name;
                document.querySelector(".temp").innerHTML = data.main.temp + "°C";
                document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
                document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";
 

      const weatherMain = data.weather[0].main.toLowerCase();
   if(weatherMain== "clouds"){
                    weatherIcon.src="images/clouds.png";

                } 
                else if(weatherMain== "clear"){
                    weatherIcon.src="images/clear.png";
            } 
            else if(weatherMain== "rain"){
                    weatherIcon.src="images/rain.png";
            } 
            else if(weatherMain== "drizzle"){
                    weatherIcon.src="images/drizzle.png";
            } 
            else if(weatherMain== "mist"){
                    weatherIcon.src="images/mist.png";
            } 
             else if(weatherMain== "snow"){
                    weatherIcon.src="images/snow.png";
            } 


            } else {
                alert("City not found. Please enter a valid city name.");
            }
        } catch (error) {
            console.error("Error fetching weather data:", error);
            alert("Unable to retrieve weather data. Please try again later.");
        }
    }
   
    if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition((position) => {
        const { latitude, longitude } = position.coords;
        getWeatherByLocation(latitude, longitude);
    }, (error) => {
        console.error("Geolocation error:", error);
        alert("Geolocation is disabled. Please search for a city.");
    });
} else {
    alert("Geolocation is not supported by your browser.");
}


    searchBtn.addEventListener("click", () => {
    if (searchBox.value.trim() === "") {
        alert("Please enter a city name.");
        return;
    }
    checkWeather(searchBox.value);
});

searchBox.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && searchBox.value.trim() !== "") {
        checkWeather(searchBox.value);
    }
});

</script>

</body>
</html>
